  - 每个关键技法必须能在成片里被指出时间码
  - "字幕/标题在竖屏安全区内,字号 ≥ 44px"
  - 音频与画面命中点对齐(误差 ≤ 1 帧)
  - "总时长精确等于设定值,无黑帧"
