    - Aseprite 绘制精灵表（sprite sheet）+ 序列帧循环（走路 6~8 帧、呼吸 2~4 帧）
quality_rules:
  - 画面主体必须由代码绘制(禁止用静态图片 + 缩放转场凑数)
  - 前 0.5 秒必须出现一个在动的元素
  - 每个关键技法必须能在成片里被指出时间码
  - "字幕/标题在竖屏安全区内,字号 ≥ 44px"
  - 音频与画面命中点对齐(误差 ≤ 1 帧)
  - "总时长精确等于设定值,无黑帧"
chart_palette:
  - "#2B2BFF"
  - "#FF5A4E"
  - "#FFC62B"
  - "#2EE6A8"
  - "#151433"
color_rules:
  harmony_type: "triadic"
  contrast_validation: true
  colorblind_safe: true
taste_profile:
  design_read: "大颗粒像素与硬边缘, 有限色板(8~32色), 8~12fps 精灵帧动画, 抖动渐变 dithering, CRT 扫描线滤镜"
  visual_variance: 7
  motion_intensity: 8
  information_density: 6
  palette_discipline: "固定使用本风格色板:#2B2BFF, #FF5A4E, #FFC62B, #2EE6A8, #151433"
  layout_variation: "版式随节拍变化,每镜只让一个主体动"
  reference_strategy: "以 HTML Canvas at 320×180 internal resolution, integer-scaled ×6 with nearest-neighbour; sprites authored as pixel arrays i 为技术路线"
  anti_patterns:
    - 静态图片加缩放转场
    - 同屏多个主体同时运动
    - 文字被裁切
  quality_gates:
